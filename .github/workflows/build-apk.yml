name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "
24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "
84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "
d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/intel-android-extra-license
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - run: gradle assembleDebug
      - name: Rename APK
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VC=$(grep "versionCode" app/build.gradle.kts | grep -o "[0-9]*")
          BUILD=${{ github.run_number }}
          TIMESTAMP=$(date +%Y%m%d)
          FILENAME="DailyRandom-v${VERSION}-build${BUILD}-${TIMESTAMP}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${FILENAME}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VC=$VC" >> $GITHUB_ENV
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
      - name: Update version.json
        run: |
          echo "{\"version\":\"${VERSION}\",\"versionCode\":${VC},\"apk\":\"${FILENAME}\"}" > version.json
          cat version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DailyRandom v${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            version.json
          generate_release_notes: true
